<!-- NOTAS IMPORTANTES
Cada HTML que se crean las páginas debe contener → <footer id="footer-global" role="contentinfo"></footer>

footer.html → guarda todo el contenido del footer (columnas, enlaces, derechos legales, botón subir, botón WhatsApp).

footer.js → hace el fetch("componentes/footer.html") y mete ese contenido dentro del contenedor.

main.js → importa footer.js y lo ejecuta junto con el header y las validaciones.

-->
